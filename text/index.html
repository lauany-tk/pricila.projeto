<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="toggle">
    <div class="container">
        <h1 class="title">Mini Kart — Demo CSS</h1>

        <label for="toggle" class="start-btn">Iniciar</label>

        <div class="game-area">
            <div class="ready">
                Pressione “Iniciar” para começar!
            </div>
            <div class="playing">
                <div class="coin"></div>
                <div class="controle"></div>
                <div class="jogo"></div>
                <div class="mario"></div>
            </div>
        </div>
    </div>
</body>
</html>
