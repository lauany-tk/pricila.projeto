<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="../../imagens/1000168307.jpg" type="image/x-icon">
    <title>Profile Card</title>
</head>

<body>
    <div class="content">
        <div class="content-main">
            <div class="content-title">
                <h2>Player card</h2>
                <img src="../../imagens/1000168307.jpg" alt="">
            </div>
            <div class="content-mission">
                <h2>Missão Semestral:</h2>
                <h1>Level Up</h1>
            </div>
            <div class="content-profile">
                <div class="profile-section">
                    <div class="img-profile-section">
                        <img src="../../imagens/1000168306.jpg" alt="">
                    </div>
                    <div class="description-profile-section">
                        <label for="">NOME:</label>
                        <input type="text" name="" id="" value="Lauany">
                        <label for="">CLASSE:</label>
                        <input type="text" name="" id="" value="INFO1V">
                    </div>
                </div>
                <div class="expirience-profile">
                    <div class="experience-descriptio-section">
                        <p>XP</p>
                        <p>120/300</p>
                    </div>
                    <div class="expirience-bar">
                        <div>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div class="unlocked-achievements">
                    <p>Conquistas desbloqueadas:</p>
                    <p>mcn cmsa,</p>
                    <div class="img-logos">
                        <img src="../../imagens/1000168308.jpg" alt="">
                        <img src="../../imagens/86fa136cbb067ccd1bb63b06de875885.jpg" alt="">
                        <img src="../../imagens/pngtree-pixel-golden-trophy-the-winner-trophy-cup-pixel-art-with-sparkle-png-image_12193294.png"
                            alt="">
                    </div>
                </div>
            </div>
        </div>
        <div class="star s1">⭐</div>
        <div class="star s2">🌟</div>
        <div class="star s3">✨</div>
        <div class="star s4">⭐</div>
        <div class="star s5">🌟</div>
    </div>
    </div>
    <div>
        <h2 Audio></h2>
        <audio autoplay loop>
            <source src="../../audios/audio.mp3" type="audio/mpeg">
        </audio>
    </div>
</body>
</html>
