<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteira de Habilitação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="tudo">
        <div class="fundo">
            <div class="semifundo">
                <h1 id="play">PLAY CARD</h1>
                <div class="insemifundo">
                    <h2 id="missao">MISSÃO SEMESTRAL:</h2>
                    <h1 id="levelup">LEVEL UP!</h1>
                    <img id="foto" src="../../imagens/a princesa.jpg">
                    <h1 id="lala">NOME:</h1>
                    <p>andrielly</p>
                    <h1 id="lulu">CLASSE:</h1>
                    <p>info1v</p>
                    <h1 id="xp">XP</h1>
                    <h1 id="fullstack">Full Stack</h1>
                    <h1 id="nums">150/300</h1>
                    <div class="bara">
                        <p id="b1"></p>
                        <p id="b2"></p>
                    </div>
                    <h1 class="conq">CONQUISTAS DESBLOQUEADAS:</h1>
                </div>
                <div class="c-image">
                    <img src="../../imagens/sapo.jpg" id="imgsapo">
                    <img src="../../imagens/estrela.jpg" id="imgestrela">
                    <img src="../../imagens/borboleta.jpg" id="imgborboleta">
                </div>
            </div>
        </div>
    </div>
    <div class="star s1">🐸</div>
    <div class="star s2">👑</div>
    <div class="star s3">🌼</div>
    <div class="star s4">✨</div>
    <div class="star s5">🤍</div>
    <div class="star s6">👸🏽</div>

    <audio autoplay loop>
        <source src="../../audios/andrielly_audio.mp3" type="audio/mpeg">
    </audio>

    <script src="main.js"></script>
</body>

</html>
